name: 한양대 공지 알림

on:
  schedule:
    # 30분마다 실행됩니다. (GitHub 사정상 몇 분 늦게 실행될 수 있어요)
    - cron: "*/30 * * * *"
  workflow_dispatch:   # GitHub 화면에서 '직접 실행(Run workflow)' 버튼을 누를 수 있게 해줍니다.

permissions:
  contents: write      # '읽은 기록(seen.json)'을 저장하기 위해 필요합니다.

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 공지 확인 후 알림 보내기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_notices.py

      - name: 읽은 기록 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen.json
          git commit -m "공지 읽음 기록 업데이트" || echo "변경사항 없음"
          git push
